<app-navbar ></app-navbar>
<app-user-card (oppenConversation)="openConversation()" *ngIf="isSet" class="absolute left-20 top-31" [profile]="profile"></app-user-card>
<div class="flex flex-col justify-center items-center">
    <div class="bg-[#FCFDFD]  border border-[#d7d9e0] rounded-2xl shadow-xl ">
    <app-post  *ngFor="let post of posts" [post]="post" class="w-150 p-6 border border-gray-200 rounded-2xl shadow  bg-white m-6 block"></app-post>
        <div #loadTrigger *ngIf="!reachedLast"></div>
    </div>
</div>

<app-conversation class="fixed right-5 bottom-5" *ngFor="let conversation of getOpenConversations()"  [conversation]="conversation" [target]="profile.id"></app-conversation>
