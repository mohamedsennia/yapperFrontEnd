
<app-user-card (oppenConversation)="openConversation()" *ngIf="isSet"  [profile]="profile"></app-user-card>
<div class="flex flex-col justify-center items-center">
    <div class="bg-[#FCFDFD]  border border-[#d7d9e0] rounded-2xl shadow-xl max-h-full">
        <app-post  *ngFor="let post of posts" [post]="post" class="w-150 p-6 border border-gray-200 rounded-2xl shadow  bg-white m-6 block"></app-post>
        <div #loadTrigger *ngIf="!reachedLast"></div>
        
        <div>
    </div>

</div>  
<div *ngIf="posts.length==0" class="w-150 h-50 p-6 border border-gray-200 rounded-2xl   bg-white m-6  text-3xl font-semibold flex items-center justify-center shadow-2xl"> 
    <span>This user has no yapps</span>
</div>
