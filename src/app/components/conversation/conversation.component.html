<div class="w-75 h-120 border border-blue-400 bg-white rounded-t-2xl">
    <div class="w-full h-[10%] bg-blue-600 px-4 flex items-center justify-between font-semibold rounded-t-2xl">
        <span class="text-white inline-block max-w-[85%] truncate">{{conversation.conversationName}}</span>
    </div>
    <div class="w-full h-[75%] flex  overflow-auto flex-col-reverse" >
        <div *ngFor="let message of conversation.messages" class="my-2 w-full px-4 flex h-fit break-words" [ngClass]="{'justify-end': message.isMine,'justify-start': !message.isMine}">
            <p class="w-fit inline-block max-w-full h-fit break-words p-2 px-3 rounded-4xl" [ngClass]="{'   bg-blue-700 text-white': message.isMine,'bg-gray-200 text-gray-900': !message.isMine}">{{message.content}}</p>
        </div>
        
    </div>
    <div class="w-full h-[15%] ">
    <input [(ngModel)]="messageContent" (keydown.enter)="sendMessage()"  class="w-full h-full outline-none p-3 border-t border-t-blue-400 placeholder:text-gray-300 whitespace-break-spaces overflow-y-scroll" placeholder="New message..">
    </div>
</div>
