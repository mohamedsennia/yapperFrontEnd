<div class="flex items-center cursor-pointer" [routerLink]="['/']">
<svg width="40" height="40" viewBox="10 0 80 60" xmlns="http://www.w3.org/2000/svg">
  <path d="M15 20C15 14.477 19.477 10 25 10H55C60.523 10 65 14.477 65 20V40C65 45.523 60.523 50 55 50H28L15 63V20Z" fill="#96dcf5" stroke="#031c25" stroke-width="4" stroke-linejoin="round"/>
  <path d="M72 30C75 33 75 37 72 40" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <path d="M78 25C83 30 83 40 78 45" stroke="#000" stroke-width="4" stroke-linecap="round"/>
</svg>
<h2 class="ml-2 text-2xl font-semibold text-[#4acdfb]" *ngIf="width>768">YAPPER</h2>
</div>
<app-input [suggestions]="users" (contentChange)="typing($event)"  width="w-[70%]" placeholder="Find other yappers.." icon="search"></app-input>
<div class="flex items-center">
   <div class="flex items-center relative">
      <svg *ngIf="width<1024"  xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-message mr-2"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M8 9h8" /><path d="M8 13h6" /><path d="M18 4a3 3 0 0 1 3 3v8a3 3 0 0 1 -3 3h-5l-5 3v-3h-2a3 3 0 0 1 -3 -3v-8a3 3 0 0 1 3 -3h12z" /></svg> 
     
   </div> 
    <div class="cursor-pointer flex items-end relative" (click)="toggleMenu()" >
   
    <span class="text-l font-medium text-gray-700 mr-2"*ngIf="width>1024">{{getUserName()}}</span>
    <svg  xmlns="http://www.w3.org/2000/svg"  width="20"  height="20"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-chevron-down"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M6 9l6 6l6 -6" /></svg>
   <div class="absolute -left-20  top-[150%] bg-white border border-gray-300 rounded-lg shadow-2xl py-2 w-40" [ngClass]="{'hidden': !menuOppen}">
        <a [routerLink]="['yapper/'+getProfileId()]" class="flex items-end  px-3 py-2 hover:bg-gray-100">
            <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-user"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" /><path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" /></svg>
           <span class="ml-1 block">Profile</span>
        </a>

        <a (click)="logout()" class="flex items-end  px-3 py-2 hover:bg-gray-100">
           <svg  xmlns="http://www.w3.org/2000/svg"  width="26"  height="24"  viewBox="-3 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-logout"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2" /><path d="M9 12h12l-3 -3" /><path d="M18 15l3 -3" /></svg>
           <span class="ml-1 block">Log out</span>
        </a>
   </div>
</div>
</div>
