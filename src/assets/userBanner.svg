<svg xmlns="http://www.w3.org/2000/svg" width="215" height="180" viewBox="0 0 1200 320" role="img" aria-label="Profile banner">
  <defs>
    <linearGradient id="bannerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fd3ff"></stop>
      <stop offset="1" stop-color="#4aa9ff"></stop>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.7)"></stop>
      <stop offset="1" stop-color="rgba(255,255,255,0.2)"></stop>
    </linearGradient>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="320" rx="20" fill="url(#bannerGrad)"></rect>

  <!-- Soft waves -->
  <path d="M0,220 C200,160 360,260 560,200 C760,140 960,220 1200,160 L1200,320 L0,320 Z" fill="url(#waveGrad)"></path>
  <path d="M0,180 C220,120 420,220 640,170 C860,120 1000,180 1200,120 L1200,320 L0,320 Z" fill="rgba(255,255,255,0.35)"></path>
</svg>
